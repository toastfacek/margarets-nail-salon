<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="A fun nail salon game for kids - file, paint, and decorate beautiful nails!" />
    <title>NAIL ICON - Glam Studio</title>
    <link rel="stylesheet" href="./styles/main.css">
  </head>
  <body>
    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>
    
    <!-- UI Overlay -->
    <div id="ui-overlay">
      <!-- Header - Magazine Masthead -->
      <header class="header">
        <h1 class="title">NAIL ICON</h1>
        <span class="subtitle">Glam Studio</span>
      </header>

      <!-- Finger Selector -->
      <div class="finger-selector" id="finger-selector">
        <button class="hand-toggle" id="hand-toggle" title="Switch Hand">
          <span class="hand-emoji">✋</span>
          <span class="hand-label">Left</span>
        </button>
        <div class="finger-buttons">
          <button class="finger-btn" data-finger="thumb" title="Thumb">1</button>
          <button class="finger-btn" data-finger="index" title="Index">2</button>
          <button class="finger-btn active" data-finger="middle" title="Middle">3</button>
          <button class="finger-btn" data-finger="ring" title="Ring">4</button>
          <button class="finger-btn" data-finger="pinky" title="Pinky">5</button>
        </div>
      </div>

      <!-- Tool Sidebar -->
      <aside class="toolbar" id="toolbar">
        <button class="tool-btn active" data-tool="shape" title="Shape">
          <span class="tool-icon">✂️</span>
          <span class="tool-label">Shape</span>
        </button>
        <button class="tool-btn" data-tool="polish" title="Polish">
          <span class="tool-icon">💅</span>
          <span class="tool-label">Polish</span>
        </button>
        <button class="tool-btn" data-tool="bling" title="Bling">
          <span class="tool-icon">💎</span>
          <span class="tool-label">Bling</span>
        </button>
        <button class="tool-btn" data-tool="brush" title="Draw">
          <span class="tool-icon">🖌️</span>
          <span class="tool-label">Draw</span>
        </button>
      </aside>
      
      <!-- Tool Options Panel (changes based on selected tool) -->
      <div class="options-panel" id="options-panel">
        <!-- Dynamic content injected here -->
      </div>
      
      <!-- Bottom Action Bar -->
      <footer class="action-bar">
        <button class="action-btn" id="btn-lock">
          <span>🔓</span>
          <span>Lock</span>
        </button>
        <button class="action-btn" id="btn-clear">
          <span>🗑️</span>
          <span>Clear</span>
        </button>
        <button class="action-btn" id="btn-undo">
          <span>↩️</span>
          <span>Undo</span>
        </button>
        <button class="action-btn primary" id="btn-done">
          <span>💅</span>
          <span>Slay!</span>
        </button>
        <button class="action-btn" id="btn-gallery">
          <span>📸</span>
          <span>Gallery</span>
        </button>
      </footer>
    </div>
    
    <!-- Gallery Modal -->
    <div class="modal" id="gallery-modal">
      <div class="modal-content">
        <button class="modal-close" id="gallery-close">✕</button>
        <h2>MY LOOKS</h2>
        <div class="gallery-grid" id="gallery-grid">
          <!-- Saved designs will appear here -->
        </div>
      </div>
    </div>

    <!-- Floating Decorations -->
    <div class="floating-decorations" aria-hidden="true">
      <span class="deco deco-star">⭐</span>
      <span class="deco deco-sparkle">✨</span>
      <span class="deco deco-heart">💖</span>
      <span class="deco deco-gem">💎</span>
    </div>
    
    <script>
      // No long-press / right-click menu over the game canvas.
      document.getElementById('canvas-container').addEventListener('contextmenu', function (e) { e.preventDefault(); });
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
